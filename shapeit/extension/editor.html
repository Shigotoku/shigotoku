<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ShapeIt — キャプチャして報告</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="icon.png" alt="" width="28" height="28" />
        <div>
          <h1>ShapeIt に報告</h1>
          <p id="authState">接続を確認中…</p>
        </div>
      </div>
      <div class="capture-actions">
        <button type="button" class="chip" id="capFull" title="表示中の画面全体">全画面</button>
        <button type="button" class="chip chip-primary" id="capRegion" title="ドラッグで範囲選択">範囲選択</button>
      </div>
    </header>

    <section class="meta">
      <label class="field">
        <span>ページタイトル</span>
        <input type="text" id="pageTitle" readonly />
      </label>
      <label class="field">
        <span>ページ URL（自動取得）</span>
        <input type="url" id="pageUrl" readonly />
      </label>
      <p class="hint" id="captureHint">キャプチャ方法を選ぶか、下のプレビューを確認してください。</p>
    </section>

    <section class="tools" id="toolBar">
      <button type="button" class="tool active" data-tool="pen">ペン</button>
      <button type="button" class="tool" data-tool="rect">矩形</button>
      <button type="button" class="tool" data-tool="arrow">矢印</button>
      <button type="button" class="tool" data-tool="text">文字</button>
      <input type="color" id="strokeColor" value="#E11D48" title="色" />
      <button type="button" class="ghost" id="undoStroke">1つ戻す</button>
    </section>

    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
      <p id="emptyShot" class="empty">スクショがありません。「範囲選択」で好きな部分だけ切り取るか、「全画面」を押してください。</p>
    </div>

    <label class="field note-field">
      <span class="note-label-row">
        <span>気づき（必須）</span>
        <button type="button" class="mic-btn" id="noteMic" title="音声入力（押すとすぐ話せます）">
          <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V19H9v2h6v-2h-2v-1.08A7 7 0 0 0 19 11h-2Z"
            />
          </svg>
          <span class="mic-label">音声入力</span>
        </button>
      </span>
      <textarea id="note" rows="3" placeholder="例: このボタンの文言が分かりにくい / 保存しても反映されない"></textarea>
    </label>

    <footer class="actions">
      <button type="button" class="secondary" id="openLogin" style="display: none">ShapeIt にログイン</button>
      <button type="button" class="secondary" id="openApp">ShapeIt を開く</button>
      <button type="button" class="primary" id="submit">この内容で報告する</button>
    </footer>
    <p id="status" class="status"></p>
    <div id="successOverlay" class="success-overlay" hidden aria-live="polite">
      <div class="success-card">
        <p class="success-icon" aria-hidden="true">✓</p>
        <p class="success-title">送信しました</p>
        <p class="success-sub">ShapeIt に気づきを届けました</p>
      </div>
    </div>

    <div id="textAnnotModal" class="text-annot-modal" hidden>
      <div class="text-annot-card" role="dialog" aria-labelledby="textAnnotTitle">
        <p id="textAnnotTitle" class="text-annot-title">注釈テキスト</p>
        <div class="text-annot-input-row">
          <input type="text" id="textAnnotInput" placeholder="文字を入力するか、マイクで話す" />
          <button type="button" class="mic-btn mic-btn--icon" id="textAnnotMic" title="音声入力（押すとすぐ話せます）">
            <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V19H9v2h6v-2h-2v-1.08A7 7 0 0 0 19 11h-2Z"
              />
            </svg>
          </button>
        </div>
        <div class="text-annot-actions">
          <button type="button" class="secondary" id="textAnnotCancel">キャンセル</button>
          <button type="button" class="primary" id="textAnnotOk">決定</button>
        </div>
      </div>
    </div>
    <script src="editor.js"></script>
  </body>
</html>

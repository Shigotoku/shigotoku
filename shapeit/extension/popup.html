<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ShapeIt 報告</title>
    <style>
      :root {
        --ink: #0b1320;
        --mint: #1f9d8a;
        --paper: #f3f6f4;
      }
      body {
        font-family: "Segoe UI", "Noto Sans JP", system-ui, sans-serif;
        width: 340px;
        margin: 0;
        padding: 14px;
        background: var(--paper);
        color: var(--ink);
      }
      h1 { font-size: 15px; margin: 0; }
      .meta { font-size: 11px; color: #5b6b7c; margin-top: 8px; word-break: break-all; }
      textarea {
        width: 100%;
        box-sizing: border-box;
        margin-top: 10px;
        min-height: 88px;
        border: 1px solid #c9d5ce;
        border-radius: 10px;
        padding: 10px;
        font: inherit;
        resize: vertical;
      }
      button {
        width: 100%;
        padding: 11px;
        margin-top: 8px;
        border-radius: 10px;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
      .primary { background: var(--mint); color: #fff; }
      .primary:disabled { opacity: 0.5; cursor: default; }
      .secondary { background: #fff; color: var(--ink); border: 1px solid #c9d5ce; }
      #preview { margin-top: 10px; max-width: 100%; border-radius: 8px; border: 1px solid #d5e0d9; display: none; }
      #status { font-size: 12px; color: #5b6b7c; margin-top: 8px; min-height: 1.2em; }
      .row { display: flex; align-items: center; gap: 10px; }
    </style>
  </head>
  <body>
    <div class="row">
      <img src="icon.png" alt="" width="32" height="32" style="border-radius: 8px" />
      <div>
        <h1>ShapeIt に報告</h1>
        <div style="font-size: 11px; color: #5b6b7c">気づいたことを一言で</div>
      </div>
    </div>
    <p class="meta" id="pageMeta">読み込み中…</p>
    <img id="preview" alt="スクリーンショット" />
    <textarea id="note" placeholder="例: このボタンの文言が分かりにくい / 保存しても反映されない" autofocus></textarea>
    <button type="button" class="primary" id="submit">報告して ShapeIt を開く</button>
    <button type="button" class="secondary" id="submitOnly">報告だけ送る（アプリは開かない）</button>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>クリッピット記録</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
      .primary { background: #f97316; color: #fff; }
      .secondary { background: #f1f5f9; color: #334155; }
      #status { font-size: 12px; color: #64748b; margin-top: 10px; min-height: 2.5em; }
    </style>
  </head>
  <body>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <img src="icon.png" alt="" width="36" height="36" style="border-radius:22%;flex-shrink:0" />
      <h1 style="margin:0">クリッピット 記録</h1>
    </div>
    <p style="font-size:12px;color:#64748b;margin:0">編集画面で「拡張と連携」後、記録を開始してください。</p>
    <button type="button" class="primary" id="start">記録開始</button>
    <button type="button" class="secondary" id="pause">一時停止</button>
    <button type="button" class="secondary" id="stop">記録停止・取り込み</button>
    <p style="font-size:11px;color:#94a3b8;margin-top:10px">Alt+Shift+S で強制キャプチャ</p>
    <label style="display:flex;align-items:center;gap:6px;font-size:11px;color:#64748b;margin-top:8px">
      <input type="checkbox" id="polish-ai" checked />
      音声説明をAIで整える（編集画面の設定を優先）
    </label>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
